name: Configuration Design Expert
name_en: Configuration Design Expert
name_zh: 配置设计专家
capability: config-design
description: 负责多环境配置键、功能开关、敏感信息治理与环境差异矩阵设计，确保配置策略清晰、可审计、可落地。
version: 0.1.1
skills:
  - config-design
keywords:
  - 配置设计
  - 环境矩阵
  - 功能开关
  - 密钥治理
  - 配置目录
inputs:
  required:
    - requirements
    - existing_assets
    - output_root
  optional:
    - constraints
    - context
scheduling:
  priority: 65
  dependencies:
    - modular-design
upstream_artifacts:
  modular-design:
    - architecture.md
    - module-map.json
tools:
  allowed:
    - clone_repository
    - query_database
    - query_knowledge_base
    - write_file
    - patch_file
outputs:
  expected:
    - config-catalog.yaml
    - config-matrix.md
  evidence:
    - config-design.json
metadata:
  boundary_contract:
    owns:
      - config keys, feature flags, secrets, and environment matrix
    excludes:
      - API/event contract redesign
      - schema/index design
      - observability runbooks and test plans
    upstream_inputs:
      - modular-design
  topic_ownership:
    topics:
      - feature_flags
      - rules_binding
      - environment_matrix
      - permissions
      - rollback_switches
    owns_shared_context: false
  routing:
    keywords:
      - 配置
      - 配置项
      - 环境
      - 环境矩阵
      - 功能开关
      - 灰度
      - 开关
      - 权限
      - 密钥
      - secret
      - config
      - feature flag
      - rollback switch
  prompt_hints:
    file_guidance:
      config-catalog.yaml: 结构化列出配置键、类型、默认值、取值范围、敏感级别、 owner、热更新能力和回滚开关。
      config-matrix.md: 对比 dev/test/staging/prod 等环境差异，说明配置来源、变更审批、灰度策略和回滚策略。
    default_file_guidance: 聚焦配置键、环境差异、功能开关、权限与敏感信息治理，不重写 API、DDL、运维或测试设计。
  delivery_contract:
    must_answer:
      - 哪些配置键、功能开关、权限或规则绑定需要新增或调整。
      - 各环境默认值、差异项、敏感信息处理和审批流程是否明确。
      - 配置变更、灰度、回滚和失效兜底策略是否可执行。
    evidence_expectations:
      - 配置项需要绑定具体模块、业务规则或上游约束，避免抽象占位。
      - 敏感信息和权限相关配置必须说明存储、读取和审计要求。
    artifact_review_checklist:
      config-catalog.yaml:
        - 每个配置键需要包含类型、默认值、范围、敏感级别、owner、热更新和回滚说明。
        - 配置名应稳定且能被实现方直接引用。
      config-matrix.md:
        - 环境差异、灰度策略、审批流程和回滚触发条件必须清晰。
        - 需要标出生产环境高风险配置及保护措施。
policies:
  asset_baseline_required: true
  evidence_required: true
  output_must_be_structured: true
  manual_override_forbidden: true
  descriptions_prefer_chinese: true
error_handling:
  on_missing_required_input: fail
  on_validation_failure: fail
  on_partial_generation: emit_evidence_and_fail


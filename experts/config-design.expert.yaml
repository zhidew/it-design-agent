name: Configuration Design Expert
name_en: Configuration Design Expert
name_zh: 配置设计专家
capability: config-design
description: 负责多环境配置键、功能开关、敏感信息治理与环境差异矩阵设计，确保配置策略清晰、可审计、可落地。
version: 0.1.1
skills:
  - config-design
keywords:
  - 配置设计
  - 环境矩阵
  - 功能开关
  - 密钥治理
  - 配置目录
inputs:
  required:
    - requirements
    - existing_assets
    - output_root
  optional:
    - constraints
    - context
scheduling:
  priority: 65
  dependencies:
    - modular-design
upstream_artifacts:
  modular-design:
    - architecture.md
    - module-map.json
tools:
  allowed:
    - clone_repository
    - query_database
    - query_knowledge_base
    - write_file
    - patch_file
outputs:
  expected:
    - config-catalog.yaml
    - config-matrix.md
  evidence:
    - config-design.json
metadata:
  boundary_contract:
    owns:
      - config keys, feature flags, secrets, and environment matrix
    excludes:
      - API/event contract redesign
      - schema/index design
      - observability runbooks and test plans
    upstream_inputs:
      - modular-design
policies:
  asset_baseline_required: true
  evidence_required: true
  output_must_be_structured: true
  manual_override_forbidden: true
  descriptions_prefer_chinese: true
error_handling:
  on_missing_required_input: fail
  on_validation_failure: fail
  on_partial_generation: emit_evidence_and_fail

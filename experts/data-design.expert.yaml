name: Data Design Expert
name_en: Data Design Expert
name_zh: 数据设计专家
capability: data-design
description: 负责数据库表结构、索引、实体关系与迁移回滚方案设计，确保数据模型稳定、可演进且便于实施。
version: 0.1.1
skills:
  - data-design
keywords:
  - 数据设计
  - DDL
  - ER
  - 迁移方案
  - 索引设计
inputs:
  required:
    - requirements
    - existing_assets
    - output_root
  optional:
    - constraints
    - context
scheduling:
  priority: 80
  dependencies:
    - modular-design
upstream_artifacts:
  modular-design:
    - architecture.md
    - module-map.json
tools:
  allowed:
    - clone_repository
    - query_database
    - query_knowledge_base
    - write_file
    - patch_file
outputs:
  expected:
    - schema.sql
    - er.md
    - migration-plan.md
  evidence:
    - data-design.json
metadata:
  boundary_contract:
    owns:
      - schema, indexes, ER relationships, and migration rollback design
    excludes:
      - full architecture narrative
      - detailed API or async contract design
      - config, ops, and test design
    upstream_inputs:
      - modular-design
policies:
  asset_baseline_required: true
  evidence_required: true
  output_must_be_structured: true
  manual_override_forbidden: true
  descriptions_prefer_chinese: true
error_handling:
  on_missing_required_input: fail
  on_validation_failure: fail
  on_partial_generation: emit_evidence_and_fail

name: Design Assembly Expert
name_en: Design Assembly Expert
name_zh: 设计聚合专家
capability: design-assembler
description: 负责聚合所有上游结构化设计产物，输出最终详细设计、需求追踪关系和评审检查清单。
version: 0.1.1
skills:
  - design-assembler
keywords:
  - 设计聚合
  - 详细设计
  - 追踪矩阵
  - 评审清单
  - 汇总编排
inputs:
  required:
    - requirements
    - existing_assets
    - output_root
  optional:
    - constraints
    - context
scheduling:
  priority: 20
  dependencies: []  # Dynamically set to all active agents
upstream_artifacts: {}
tools:
  allowed:
    - write_file
    - patch_file
outputs:
  expected:
    - detailed-design.md
    - implementation-plan.json
    - us-items.json
    - traceability.json
    - review-checklist.md
  evidence:
    - design-assembler.json
metadata:
  boundary_contract:
    owns:
      - synthesis, cross-artifact alignment, and traceability
    excludes:
      - invention of new detailed designs beyond upstream artifacts
    upstream_inputs: []
  topic_ownership:
    topics:
      - shared_context
      - cross_artifact_alignment
      - traceability
      - final_package
    owns_shared_context: true
    shared_context_topics:
      - project_background
      - requirement_overview
      - scope
      - target_outcomes
      - cross_artifact_alignment
    generic_shared_context_section_examples: 项目背景 / 需求背景 / 建设目标 / 范围说明 / 总体方案 / 需求概述
  routing:
    keywords:
      - 汇总
      - 聚合
      - 整合
      - 详细设计
      - 追踪
      - 追踪矩阵
      - 一致性
      - 评审清单
      - traceability
      - synthesis
      - final package
  prompt_hints:
    file_guidance:
      detailed-design.md: 聚合上游专家产物，形成一致的最终详细设计，标出跨产物依赖、冲突处理和残余假设，不新增未经上游支撑的设计。
      implementation-plan.json: 结构化输出实施阶段、任务、依赖、风险、验收点和对应产物，保持可追踪。
      us-items.json: 将一个 IR 拆解为多个可交给 Code Agent 开发的 US item，包含 us_id、title、description、source_requirement_ids、acceptance_summary、confidence、artifact_refs 和 validation/status。
      traceability.json: 建立需求、设计产物、关键决策和验证项之间的追踪关系，字段稳定且可机器读取。
      review-checklist.md: 汇总跨专家评审项，覆盖一致性、完整性、风险、约束和待确认问题。
    default_file_guidance: 聚焦综合、对齐和追踪，不替代上游专家生成新的领域/API/数据/测试细节。
  delivery_contract:
    must_answer:
      - 上游产物之间的关键设计是否一致，冲突和缺口是否被标出。
      - 最终详细设计是否能追踪到需求、上游产物和关键决策来源。
      - 实施计划、追踪矩阵和评审清单是否结构化且可执行。
    evidence_expectations:
      - 每个综合结论需要引用上游产物或明确说明是最小一致性 stitching。
      - 对缺失、冲突或低置信度内容必须保留为待确认项，而不是自行补设计。
    artifact_review_checklist:
      detailed-design.md:
        - 需要覆盖核心设计结论、跨产物一致性、残余风险和待确认项。
        - 不得凭空新增未被上游产物支撑的详细设计。
      implementation-plan.json:
        - 阶段、任务、依赖、风险、验收点和关联产物必须结构化。
        - 需要能支持后续实施排期和责任拆分。
      us-items.json:
        - 必须包含 schema_version、status、items 和 validation。
        - 每个 item 必须包含唯一 us_id、标题、说明、来源 IR/证据引用和置信度。
        - status 只能是 valid、partial 或 invalid。
      traceability.json:
        - 需求、设计产物、关键决策和验证项之间的映射必须完整且稳定。
        - 需要标出未覆盖或低置信度的追踪关系。
      review-checklist.md:
        - 评审项需要覆盖一致性、完整性、风险、约束和待确认问题。
        - 不能只列通用检查项，必须关联本次设计产物。
policies:
  asset_baseline_required: true
  evidence_required: true
  output_must_be_structured: true
  manual_override_forbidden: true
  descriptions_prefer_chinese: true
  planner_selection:
    llm_selectable: false
    default_selected: true
error_handling:
  on_missing_required_input: fail
  on_validation_failure: fail
  on_partial_generation: emit_evidence_and_fail


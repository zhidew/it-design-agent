name: Integration Design Expert
name_en: Integration Design Expert
name_zh: 集成设计专家
capability: integration-design
description: 负责跨服务与外部系统的集成协议、异步事件、幂等重试与补偿策略设计，确保集成边界清晰且可实现。
version: 0.1.1
skills:
  - integration-design
keywords:
  - 集成设计
  - AsyncAPI
  - 幂等
  - 补偿
  - 重试策略
inputs:
  required:
    - requirements
    - existing_assets
    - output_root
  optional:
    - constraints
    - context
    - provider
scheduling:
  priority: 85
  dependencies:
    - modular-design
upstream_artifacts:
  modular-design:
    - architecture.md
    - module-map.json
tools:
  allowed:
    - clone_repository
    - query_database
    - query_knowledge_base
    - write_file
    - patch_file
outputs:
  expected:
    - integration.md
    - asyncapi.yaml
  evidence:
    - integration-design.json
metadata:
  boundary_contract:
    owns:
      - cross-service and external integration contracts
      - async events, retries, idempotency, and compensation
    excludes:
      - full REST schema catalog
      - detailed DDL or index design
      - config matrix, ops, and test design
    upstream_inputs:
      - modular-design
policies:
  asset_baseline_required: true
  evidence_required: true
  output_must_be_structured: true
  manual_override_forbidden: true
  descriptions_prefer_chinese: true
error_handling:
  on_missing_required_input: fail
  on_validation_failure: fail
  on_partial_generation: emit_evidence_and_fail

name: Modular Design Expert
name_en: Modular Design Expert
name_zh: 模块化设计专家
capability: modular-design
description: 负责系统上下文、容器划分、模块边界和允许依赖关系设计，为后续专家提供统一的结构约束。
version: 0.1.1
skills:
  - modular-design
keywords:
  - 模块化设计
  - 系统上下文
  - 容器划分
  - 依赖映射
  - 架构边界
inputs:
  required:
    - requirements
    - existing_assets
    - output_root
  optional:
    - constraints
    - context
scheduling:
  priority: 90
  dependencies: []
upstream_artifacts: {}
tools:
  allowed:
    - clone_repository
    - query_database
    - query_knowledge_base
    - write_file
    - patch_file
outputs:
  expected:
    - architecture.md
    - module-map.json
  evidence:
    - modular-design.json
interaction:
  clarification:
    supported_question_types:
      - single_select
      - multi_select
      - long_text
    default_topics:
      - scope
      - system_boundary
      - dependency_constraint
    answer_merge_targets:
      - clarified_requirements
      - decision_log
metadata:
  boundary_contract:
    owns:
      - system context and container decomposition
      - module ownership and allowed dependencies
    excludes:
      - async event contract details
      - detailed schema or index design
      - config matrix, ops runbook, and test case design
    upstream_inputs: []
  topic_ownership:
    topics:
      - shared_context
      - system_boundary
      - container_decomposition
      - module_ownership
      - reuse_points
    owns_shared_context: true
    shared_context_topics:
      - project_background
      - requirement_overview
      - scope
      - global_goals
      - cross_cutting_constraints
      - target_outcomes
  routing:
    keywords:
      - 模块化
      - 模块
      - 边界
      - 容器
      - 上下文
      - 依赖
      - 复用点
      - 架构边界
      - system context
      - container
      - module ownership
  prompt_hints:
    file_guidance:
      architecture.md: 描述系统上下文、容器划分、模块职责、关键交互和边界约束，为后续专家提供共享结构事实。
      module-map.json: 保持结构化模块映射稳定，明确模块标识、职责、依赖、复用点、禁止依赖和下游专家可引用字段。
    default_file_guidance: 聚焦模块边界、容器职责、复用点和允许依赖，不展开下游专家的详细契约、DDL、配置或测试内容。
  delivery_contract:
    must_answer:
      - 系统边界、外部依赖、核心容器和模块职责是否清晰可追踪。
      - 模块之间允许依赖、禁止依赖、复用点和下游设计输入是否明确。
      - 哪些共享背景由本专家承接，哪些细节必须交给下游专家继续展开。
    evidence_expectations:
      - 需要引用需求中的关键业务边界、上下游系统和约束来源。
      - module-map.json 中的模块标识、职责和依赖关系必须能支撑后续专家引用。
    artifact_review_checklist:
      architecture.md:
        - 必须覆盖系统上下文、容器划分、模块职责、关键交互和边界约束。
        - 不能展开 API、DDL、配置、运维或测试细节，只保留下游需要的结构事实。
      module-map.json:
        - 模块标识、职责、依赖、复用点和禁止依赖需要结构化且命名稳定。
        - 下游专家可引用字段必须完整，不能只写自然语言描述。
policies:
  asset_baseline_required: true
  evidence_required: true
  output_must_be_structured: true
  manual_override_forbidden: true
  descriptions_prefer_chinese: true
error_handling:
  on_missing_required_input: fail
  on_validation_failure: fail
  on_partial_generation: emit_evidence_and_fail


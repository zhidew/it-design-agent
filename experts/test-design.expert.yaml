name: Test Design Expert
name_en: Test Design Expert
name_zh: 测试设计专家
capability: test-design
description: 负责测试输入、覆盖率映射和验证场景设计，确保关键业务路径、异常场景和非功能风险都能被验证。
version: 0.1.1
skills:
  - test-design
keywords:
  - 测试设计
  - 覆盖率映射
  - 边界测试
  - 异常场景
  - 并发测试
inputs:
  required:
    - requirements
    - existing_assets
    - output_root
  optional:
    - constraints
    - context
scheduling:
  priority: 50
  dependencies:
    - flow-design
    - api-design
    - integration-design
    - performance-design
    - ops-design
upstream_artifacts:
  flow-design:
    - sequence.md
    - state.md
  api-design:
    - api-design.md
    - errors-rfc9457.json
  integration-design:
    - integration.md
    - asyncapi.yaml
  performance-design:
    - performance-design.md
    - performance-budget.yaml
    - capacity-assessment.json
  ops-design:
    - slo.yaml
    - observability-spec.yaml
    - deployment-runbook.md
tools:
  allowed:
    - clone_repository
    - query_database
    - query_knowledge_base
    - write_file
    - patch_file
outputs:
  expected:
    - test-inputs.md
    - coverage-map.json
  evidence:
    - test-design.json
metadata:
  boundary_contract:
    owns:
      - test inputs, coverage mapping, and verification scenarios
    excludes:
      - redesign of architecture, domain, API, integration, data, config, or ops artifacts
    upstream_inputs:
      - flow-design
      - api-design
      - integration-design
      - performance-design
      - ops-design
policies:
  asset_baseline_required: true
  evidence_required: true
  output_must_be_structured: true
  manual_override_forbidden: true
  descriptions_prefer_chinese: true
error_handling:
  on_missing_required_input: fail
  on_validation_failure: fail
  on_partial_generation: emit_evidence_and_fail

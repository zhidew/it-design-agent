name: Test Design Expert
name_en: Test Design Expert
name_zh: 测试设计专家
capability: test-design
description: 负责基于 IR 颗粒度输出测试策略设计与测试方案设计，并判断当前 IR 颗粒度是否适中；默认先做策略设计，再基于策略结果做方案设计，若已有可复用策略则允许只输出测试方案设计。
version: 0.3.0
skills:
  - test-design
keywords:
  - 测试策略
  - 测试方案
  - IR测试设计
  - IR颗粒度
  - 测试策略设计
  - 测试方案设计
  - 策略复用
  - 验收追踪
  - 验证主题
inputs:
  required:
    - requirements
    - existing_assets
    - output_root
  optional:
    - constraints
    - context
scheduling:
  priority: 50
  dependencies:
    - flow-design
    - api-design
    - integration-design
    - performance-design
    - ops-design
upstream_artifacts:
  flow-design:
    - sequence.md
    - state.md
  api-design:
    - api-design.md
    - errors-rfc9457.json
  integration-design:
    - integration.md
    - asyncapi.yaml
  performance-design:
    - performance-design.md
    - performance-budget.yaml
    - capacity-assessment.json
  ops-design:
    - slo.yaml
    - observability-spec.yaml
    - deployment-runbook.md
tools:
  allowed:
    - clone_repository
    - query_database
    - query_knowledge_base
    - write_file
    - patch_file
outputs:
  expected:
    - test-strategy-design.md
    - test-solution-design.md
  evidence:
    - test-design.json
metadata:
  boundary_contract:
    owns:
      - IR-level test strategy design, test solution design, verification themes, strategy reuse assessment, and IR granularity assessment
    excludes:
      - test case steps, equivalence-class enumeration, boundary-value listings, automation scripts, or redesign of architecture, domain, API, integration, data, config, or ops artifacts
    upstream_inputs:
      - flow-design
      - api-design
      - integration-design
      - performance-design
      - ops-design
policies:
  asset_baseline_required: true
  evidence_required: true
  output_must_be_structured: true
  manual_override_forbidden: true
  descriptions_prefer_chinese: true
error_handling:
  on_missing_required_input: fail
  on_validation_failure: fail
  on_partial_generation: emit_evidence_and_fail

name: Validation Expert
name_en: Validation Expert
name_zh: 验证专家
capability: validator
description: 负责验证设计产物的完整性、一致性与可交付性，输出验证报告、问题清单和证据说明。
version: 0.1.1
skills:
  - validator
keywords:
  - 验证
  - 一致性检查
  - 设计评审
  - 质量门禁
  - 验证报告
inputs:
  required:
    - requirements
    - existing_assets
    - output_root
  optional:
    - constraints
    - context
scheduling:
  priority: 10
  dependencies:
    - design-assembler
upstream_artifacts:
  design-assembler:
    - detailed-design.md
    - traceability.json
    - review-checklist.md
tools:
  allowed:
    - run_command
    - validate_artifacts
    - write_file
    - patch_file
outputs:
  expected:
    - validation-report.md
  evidence:
    - validator.json
metadata:
  boundary_contract:
    owns:
      - validation findings, consistency checks, and gap reporting
    excludes:
      - generating replacement design content
    upstream_inputs:
      - design-assembler
  topic_ownership:
    topics:
      - consistency_checks
      - gap_analysis
      - residual_risks
    owns_shared_context: false
  routing:
    keywords:
      - 验证
      - 校验
      - 一致性
      - 冲突
      - 缺口
      - 风险
      - 质量门禁
      - 评审
      - validation
      - consistency
      - gap
      - risk
  prompt_hints:
    file_guidance:
      validation-report.md: 输出验证范围、通过项、问题清单、冲突/缺口、证据来源、风险等级和建议处理方式，不生成替代设计。
    default_file_guidance: 聚焦验证结论和证据，不重写或扩展任何专家设计产物。
  delivery_contract:
    must_answer:
      - 设计产物是否覆盖需求、关键约束和必需交付物。
      - 上游产物之间是否存在命名、流程、数据、接口、配置、运维或测试不一致。
      - 残余风险、缺口、阻塞项和建议处理动作是否清晰分级。
    evidence_expectations:
      - 每条发现必须引用具体产物、章节、字段或缺失证据。
      - 对无法验证的内容要标为缺证据或待确认，不能自行补齐设计。
    artifact_review_checklist:
      validation-report.md:
        - 报告需要区分通过项、问题、风险、缺口和待确认项。
        - 每条问题应包含影响、证据来源、严重度和建议处理方式。
policies:
  asset_baseline_required: true
  evidence_required: true
  output_must_be_structured: true
  manual_override_forbidden: true
  descriptions_prefer_chinese: true
  planner_selection:
    llm_selectable: false
    default_selected: true
error_handling:
  on_missing_required_input: fail
  on_validation_failure: warn
  on_partial_generation: emit_evidence_and_fail

